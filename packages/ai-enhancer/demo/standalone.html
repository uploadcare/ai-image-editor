<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Enhancer — Standalone</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    .uc-light { color-scheme: light; }
    .uc-dark { color-scheme: dark; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: light-dark(#f6f7f9, #1b1b1f);
      color: light-dark(#111, #f5f5f5);
      min-height: 100vh;
    }
    uc-ai-editor {
      display: block;
      max-width: 1200px;
      height: min(82vh, 820px);
      margin: 0 auto;
    }
    uc-ai-editor.brand-overrides {
      --uc-ai-primary: oklch(0.6 0.18 25);
      --uc-ai-primary-hover: oklch(0.55 0.18 25);
      --uc-ai-radius: 20px;
      --uc-ai-radius-button: 12px;
    }
  </style>
</head>
<body>
  <demo-shell heading="AI Enhancer — Standalone">
    <label slot="controls">
      Environment
      <select id="env">
        <option value="production">production</option>
        <option value="staging">staging</option>
      </select>
    </label>
    <label slot="controls">
      Public key
      <input id="pubkey" type="text" size="20" />
    </label>
    <label slot="controls">
      Source UUID (edit mode)
      <input id="source" type="text" size="36" placeholder="uuid to edit (blank = generate)" />
    </label>
    <label slot="controls">
      Source filename
      <input id="source-filename" type="text" size="16" placeholder="result name (edit mode)" />
    </label>
    <label slot="controls">
      Composer placement
      <select id="composer-placement">
        <option value="bottom" selected>bottom (default)</option>
        <option value="top">top</option>
      </select>
    </label>
    <label slot="controls">
      Canvas fit
      <select id="canvas-fit">
        <option value="available" selected>available (default)</option>
        <option value="full">full</option>
      </select>
    </label>
    <label slot="controls">
      History placement
      <select id="history-placement">
        <option value="composer-above">composer-above (default)</option>
        <option value="composer-below">composer-below</option>
        <option value="canvas-top">canvas-top</option>
        <option value="canvas-bottom">canvas-bottom</option>
      </select>
    </label>
    <label slot="controls">
      Toolbar placement
      <select id="toolbar-placement">
        <option value="bottom">bottom (default)</option>
        <option value="top">top</option>
      </select>
    </label>
    <label slot="controls">
      Aspect ratios
      <input id="aspect-ratios" type="text" size="16" placeholder="e.g. 16:9 1:1 4:3" />
    </label>
    <label slot="controls">
      Locale
      <select id="locale"></select>
    </label>
    <label slot="controls">
      <input id="presets-only" type="checkbox" /> Presets only
    </label>
    <label slot="controls">
      <input id="custom-presets" type="checkbox" /> Custom presets
    </label>
    <label slot="controls">
      <input id="composer-auto-hide" type="checkbox" /> Composer auto-hide
    </label>
    <label slot="controls">
      <input id="branded" type="checkbox" /> Brand-themed
    </label>

    <uc-ai-editor></uc-ai-editor>
  </demo-shell>

  <script type="module">
    import './demo-shell.ts';
    import '../src/index.ts';
    import { SUPPORTED_LOCALES } from '../src/shared/i18n/index.ts';

    const ENVIRONMENTS = {
      // Production is the SDK default — no need to set URLs explicitly.
      production: {
        pubkey: 'YOUR_PUBLIC_KEY',
      },
      staging: {
        pubkey: 'YOUR_PUBLIC_KEY',
        baseUrl: 'https://upload.example.com',
        cdnCnamePrefixed: 'https://cdn.example.com',
      },
    };

    // Persist the env choice across reloads (and shared with the plugin demo).
    const ENV_STORAGE_KEY = 'uc-ai-demo-env';
    const savedEnv = localStorage.getItem(ENV_STORAGE_KEY);

    const shell = document.querySelector('demo-shell');
    const editor = document.querySelector('uc-ai-editor');
    const pubkeyInput = document.getElementById('pubkey');
    const envSelect = document.getElementById('env');

    let currentEnv = ENVIRONMENTS[savedEnv] ? savedEnv : 'production';

    function applyEnv(name) {
      const env = ENVIRONMENTS[name];
      currentEnv = name;
      editor.baseUrl = env.baseUrl;
      editor.cdnCnamePrefixed = env.cdnCnamePrefixed;
      editor.pubkey = env.pubkey;
      pubkeyInput.value = env.pubkey;
    }

    envSelect.value = currentEnv;
    applyEnv(currentEnv);

    envSelect.addEventListener('change', (e) => {
      localStorage.setItem(ENV_STORAGE_KEY, e.target.value);
      applyEnv(e.target.value);
      shell.log(`env → ${currentEnv}`);
    });

    document.getElementById('branded').addEventListener('change', (e) => {
      editor.classList.toggle('brand-overrides', e.target.checked);
      shell.log(`brand-themed: ${e.target.checked}`);
    });
    pubkeyInput.addEventListener('change', (e) => {
      const key = e.target.value.trim() || ENVIRONMENTS[currentEnv].pubkey;
      editor.pubkey = key;
      pubkeyInput.value = key;
      shell.log(`pubkey → ${key}`);
    });
    document.getElementById('source').addEventListener('change', (e) => {
      const uuid = e.target.value.trim();
      editor.source = uuid || null;
      shell.log(uuid ? `source → ${uuid} (edit mode)` : 'source cleared (generate mode)');
    });
    document.getElementById('source-filename').addEventListener('change', (e) => {
      const name = e.target.value.trim();
      editor.sourceFilename = name || null;
      shell.log(`source-filename → ${name || '(none)'}`);
    });
    document.getElementById('composer-placement').addEventListener('change', (e) => {
      editor.composerPlacement = e.target.value;
      shell.log(`composer-placement → ${e.target.value}`);
    });
    document.getElementById('canvas-fit').addEventListener('change', (e) => {
      editor.canvasFit = e.target.value;
      shell.log(`canvas-fit → ${e.target.value}`);
    });
    document.getElementById('history-placement').addEventListener('change', (e) => {
      editor.historyPlacement = e.target.value;
      shell.log(`history-placement → ${e.target.value}`);
    });
    document.getElementById('toolbar-placement').addEventListener('change', (e) => {
      editor.toolbarPlacement = e.target.value;
      shell.log(`toolbar-placement → ${e.target.value}`);
    });
    document.getElementById('aspect-ratios').addEventListener('change', (e) => {
      const value = e.target.value.trim();
      editor.setAttribute('aspect-ratios', value);
      shell.log(`aspect-ratios → ${value || '(default)'}`);
    });
    document.getElementById('presets-only').addEventListener('change', (e) => {
      editor.presetsOnly = e.target.checked;
      shell.log(`presets-only: ${e.target.checked}`);
    });
    document.getElementById('custom-presets').addEventListener('change', (e) => {
      // One mode-keyed property; modes left out keep their built-in presets.
      editor.presets = e.target.checked
        ? {
            generate: [
              { label: 'Logo', prompt: 'A minimal vector logo of ' },
              { label: 'Sticker', prompt: 'A die-cut glossy sticker of ' },
              { label: '3D render', prompt: 'A studio-lit 3D render of ' },
            ],
            edit: [
              { label: 'Enhance', prompt: 'Enhance sharpness and lighting' },
              { label: 'B&W', prompt: 'Convert to black and white' },
            ],
          }
        : {};
      shell.log(`custom-presets: ${e.target.checked}`);
    });
    document.getElementById('composer-auto-hide').addEventListener('change', (e) => {
      editor.composerAutoHide = e.target.checked;
      shell.log(`composer-auto-hide: ${e.target.checked}`);
    });

    const localeSelect = document.getElementById('locale');
    for (const name of SUPPORTED_LOCALES) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      localeSelect.append(opt);
    }
    localeSelect.value = 'en';
    localeSelect.addEventListener('change', (e) => {
      const name = e.target.value;
      // The editor lazy-loads the locale's built-in strings itself.
      editor.localeName = name;
      shell.log(`locale → ${name}`);
    });
  </script>
</body>
</html>
