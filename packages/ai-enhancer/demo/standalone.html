<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Enhancer — Standalone</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    .uc-light { color-scheme: light; }
    .uc-dark { color-scheme: dark; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: light-dark(#f6f7f9, #1b1b1f);
      color: light-dark(#111, #f5f5f5);
      min-height: 100vh;
    }
    uc-ai-editor {
      display: block;
      max-width: 583px;
      margin: 0 auto;
    }
    uc-ai-editor.brand-overrides {
      --uc-ai-primary: oklch(0.6 0.18 25);
      --uc-ai-primary-hover: oklch(0.55 0.18 25);
      --uc-ai-radius: 20px;
      --uc-ai-radius-button: 12px;
    }
  </style>
</head>
<body>
  <demo-shell heading="AI Enhancer — Standalone">
    <label slot="controls">
      Public key
      <input id="pubkey" type="text" size="20" placeholder="5f124c1a3f9e9b6303c3" />
    </label>
    <label slot="controls">
      Locale
      <select id="locale"></select>
    </label>
    <label slot="controls">
      <input id="branded" type="checkbox" /> Brand-themed
    </label>

    <uc-ai-editor mode="generate"></uc-ai-editor>
  </demo-shell>

  <script type="module">
    import './demo-shell.ts';
    import '../src/index.ts';
    import { LOCALE_LOADERS, SUPPORTED_LOCALES } from '../src/shared/i18n/index.ts';

    const DEMO_PUBKEY = '5f124c1a3f9e9b6303c3';

    const shell = document.querySelector('demo-shell');
    const editor = document.querySelector('uc-ai-editor');
    editor.baseUrl = 'https://upload.uploadcare.com';
    editor.cdnCnamePrefixed = 'https://ucarecd.net';
    editor.pubkey = DEMO_PUBKEY;

    document.getElementById('branded').addEventListener('change', (e) => {
      editor.classList.toggle('brand-overrides', e.target.checked);
      shell.log(`brand-themed: ${e.target.checked}`);
    });
    document.getElementById('pubkey').addEventListener('change', (e) => {
      const key = e.target.value.trim() || DEMO_PUBKEY;
      editor.pubkey = key;
      shell.log(`pubkey → ${key}`);
    });

    const localeSelect = document.getElementById('locale');
    for (const name of SUPPORTED_LOCALES) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      localeSelect.append(opt);
    }
    localeSelect.value = 'en';
    localeSelect.addEventListener('change', async (e) => {
      const name = e.target.value;
      editor.l10nOverrides = await LOCALE_LOADERS[name]();
      shell.log(`locale → ${name}`);
    });
  </script>
</body>
</html>
