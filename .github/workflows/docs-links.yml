name: docs links

# Weekly check that every link to the Uploadcare docs (uploadcare.com/docs,
# where the guides live) from the docs site, the READMEs and the package
# homepages still loads, and that its #anchor exists. The Fern pages change in
# another repo (uploadcare/fern-docs), so a rename there breaks links here
# without failing anything else.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build -w @uploadcare/ai-image-editor
      - run: npm run docs:check-links -w @uploadcare/ai-image-editor
