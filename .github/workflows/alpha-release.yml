name: alpha-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch is allowed for alpha releases
        run: |
          # add allowed branch patterns here
          case "$GITHUB_REF_NAME" in
            alpha/* | next/*)
              echo "Branch $GITHUB_REF_NAME is allowed"
              ;;
            *)
              echo "::error::Alpha releases are only allowed from alpha/* or next/* branches, got $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Set alpha version
        run: |
          base=$(node -p "require('./packages/ai-image-editor/package.json').version")
          slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          version="$base-alpha.$slug.$GITHUB_RUN_NUMBER"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # npm pkg set instead of npm version: the latter re-resolves the
          # workspace dependency range against the registry and fails
          npm pkg set "version=$version" -w packages/ai-image-editor -w packages/react-ai-image-editor
          npm pkg set "dependencies.@uploadcare/ai-image-editor=$version" -w packages/react-ai-image-editor

      - run: npm run build

      - name: Publish alpha to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --tag alpha -w packages/ai-image-editor -w packages/react-ai-image-editor

      - name: Summary
        run: |
          echo "Published \`@uploadcare/ai-image-editor@$VERSION\` and \`@uploadcare/react-ai-image-editor@$VERSION\` under the \`alpha\` dist-tag" >> "$GITHUB_STEP_SUMMARY"
