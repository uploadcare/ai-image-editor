name: checks

# docs-only changes (site pages, READMEs) don't trigger tests; the full matrix
# (React 18 + 19 + the Next.js fixture) runs only on release-please PRs — the
# gate before publishing — while day-to-day PRs run the React 19 leg
on:
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/ai-image-editor/docs/**'
      - 'packages/ai-image-editor/docs/.vitepress/**'
      - '!packages/*/README.md'
      - 'biome.json'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/ai-image-editor/docs/**'
      - 'packages/ai-image-editor/docs/.vitepress/**'
      - '!packages/*/README.md'
      - 'biome.json'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # react-ai-image-editor's types resolve against the built ai-image-editor dist
      - run: npm run build -w @uploadcare/ai-image-editor

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ${{ fromJSON(startsWith(github.head_ref, 'release-please--') && '[18, 19]' || '[19]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # the default install is React 19; older peer-range legs swap it in place
      - name: Pin React ${{ matrix.react }}
        if: matrix.react != 19
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run build --workspaces --if-present

      - run: npm run test --workspaces --if-present

  next-fixture:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --workspaces --if-present

      - name: Build Next.js fixture (SSR/prerender proof)
        run: npm run test:next -w @uploadcare/react-ai-image-editor
