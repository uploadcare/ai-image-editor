name: contract

# The derivative API contract tests against the real upload.uploadcare.com.
# Run by hand only (each run spends one AI generation); the same tests run
# against the emulator in every `npm test`. Needs the UC_CONTRACT_PUBLIC_KEY
# secret: a project with AI derivatives enabled and signed uploads off. When
# it is missing the run fails instead of skipping.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the contract tests against the real API
        env:
          UC_CONTRACT_PUBLIC_KEY: ${{ secrets.UC_CONTRACT_PUBLIC_KEY }}
        run: npm run test:contract:live -w @uploadcare/ai-image-editor
