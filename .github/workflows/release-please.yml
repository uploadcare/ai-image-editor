name: release-please

on:
  push:
    branches:
      - main
  # manual recovery path: re-publish current versions if a publish failed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # pinned rather than relying on the action's repo-default-branch
          # fallback: releases are always cut from main
          target-branch: main

      # for the commit-message amend and stale-branch rebuild below.
      # fetch-depth 0 is load-bearing: in a shallow clone git grafts HEAD as
      # parentless, so `commit --amend` would produce an orphan commit and
      # force-pushing it severs the branch from main (the PR then shows
      # conflicts against all of history)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # linked-versions grouping leaves ${version} unresolved in the title
      # patterns, so the PR is retitled here with the actual version instead.
      # The branch commit gets the same message: GitHub prefills a
      # single-commit squash merge from the commit message, not the PR title.
      - name: Retitle release PR, its commit, and request reviewers
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r .number <<< "$PR_JSON")
          branch=$(jq -r .headBranchName <<< "$PR_JSON")
          git fetch -q origin "$branch"
          git checkout -q -B release-branch "origin/$branch"
          version=$(jq -r '."packages/ai-image-editor"' .release-please-manifest.json)
          title="chore: release v$version 🚀"
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --add-reviewer nd0ut,egordidenko
          if [ "$(git log -1 --format=%s)" != "$title" ]; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --amend -m "$title"
            # invariant: the amended commit must keep its parent — an orphan
            # here means a shallow/grafted checkout, and pushing it would
            # disconnect the release branch from main
            if [ -z "$(git log -1 --format=%P)" ]; then
              echo "::error::amended commit has no parent (shallow checkout?) — refusing to push"
              exit 1
            fi
            git push --force-with-lease origin "HEAD:$branch"
          fi

      # release-please only refreshes the release branch when its own content
      # (changelog/versions) changes, so a changelog-hidden merge (refactor,
      # ci, chore) touching package.json or the lockfile leaves the release PR
      # conflicting against main. Rebuild the release commit on top of current
      # main whenever the branch has gone stale.
      - name: Rebuild stale release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='release-please--branches--main'
          git fetch -q origin main "$branch" || { echo 'no release branch — nothing to rebuild'; exit 0; }
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo 'no open release PR — nothing to rebuild'; exit 0; fi
          if git merge-base --is-ancestor origin/main "origin/$branch"; then
            echo 'release branch already based on current main'; exit 0
          fi
          echo "release branch is stale — rebuilding onto $(git rev-parse --short origin/main)"
          version=$(git show "origin/$branch:.release-please-manifest.json" | jq -r '."packages/ai-image-editor"')
          git checkout -q -B release-rebuild origin/main
          # changelogs + manifest are wholly release-please-generated: take them as-is
          git checkout "origin/$branch" -- .release-please-manifest.json packages/ai-image-editor/CHANGELOG.md packages/react-ai-image-editor/CHANGELOG.md
          # versions + inter-package range are surgical; the lockfile is regenerated
          npm pkg set version="$version" -w packages/ai-image-editor -w packages/react-ai-image-editor
          npm pkg set "dependencies.@uploadcare/ai-image-editor=^$version" -w packages/react-ai-image-editor
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: release v$version 🚀"
          git push --force-with-lease="refs/heads/$branch:$(git rev-parse "origin/$branch")" origin "HEAD:refs/heads/$branch"

      # release-please builds GitHub release notes from the release PR body,
      # not from CHANGELOG.md — mirror the changelog file (including any manual
      # edits made in the release PR) into the release notes
      - name: Mirror CHANGELOG into GitHub release notes
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          for path in $(jq -r '.paths_released | fromjson | .[]' <<< "$OUTPUTS"); do
            tag=$(jq -r --arg k "$path--tag_name" '.[$k]' <<< "$OUTPUTS")
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "::warning::No tag_name output for $path, skipping"
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/contents/$path/CHANGELOG.md?ref=$tag" \
              --jq .content | base64 -d > changelog.md
            # newest release section: from the first '## ' heading to the next one
            awk '/^## /{n++} n==1' changelog.md > notes.md
            echo "Updating release notes of $tag from $path/CHANGELOG.md"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          done

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stage requires npm >= 11.15.0; stay within the 11.x major
      - name: Update npm
        run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      - name: Stage publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          message=""
          for dir in packages/ai-image-editor packages/react-ai-image-editor; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm — skipping"
            elif npm view "$name" version >/dev/null 2>&1; then
              echo "Staging $name@$version — approve it in the Staged Packages tab on npmjs.com"
              (cd "$dir" && npm stage publish)
              message+=":package: *$name@$version* staged for review"$'\n'
              message+="Review & approve (2FA required): https://www.npmjs.com/package/$name?activeTab=staged"$'\n\n'
            else
              # npm stage publish cannot create a brand-new package,
              # so the very first release is published directly
              echo "$name has never been published — bootstrapping with a direct publish"
              (cd "$dir" && npm publish)
              message+=":package: *$name@$version* published (bootstrap): https://www.npmjs.com/package/$name"$'\n\n'
            fi
          done
          if [ -n "$message" ]; then
            {
              echo "message<<SLACK_EOF"
              echo "$message"
              echo "SLACK_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack about staged release
        if: steps.publish.outputs.message != ''
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_NPM_RELEASE_CHANNEL }}",
              "text": ${{ toJSON(steps.publish.outputs.message) }}
            }
