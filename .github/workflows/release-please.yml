name: release-please

on:
  push:
    branches:
      # repo default branch — update if the default branch is renamed
      - feature/ai-enhancer

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stage requires npm >= 11.15.0
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Stage publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/ai-enhancer packages/react-ai-enhancer; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name" version >/dev/null 2>&1; then
              echo "Staging $name@$version — approve it in the Staged Packages tab on npmjs.com"
              (cd "$dir" && npm stage publish)
            else
              # npm stage publish cannot create a brand-new package,
              # so the very first release is published directly
              echo "$name has never been published — bootstrapping with a direct publish"
              (cd "$dir" && npm publish)
            fi
          done
